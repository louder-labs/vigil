<!doctype html>
<html><head><meta charset="utf-8"><title>X header</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Manrope:wght@500;700&display=block">
<style>
/* 1500x500 X header. The profile photo covers the lower-left corner, so content sits right of center. */
html,body{margin:0;width:1500px;height:500px;overflow:hidden;background:#03040E}
.h{position:relative;width:1500px;height:500px;background:radial-gradient(70% 140% at 62% 50%,#151B4D,#03040E 72%);color:#FFF8EA}
.dots{position:absolute;inset:0;background-image:radial-gradient(#FFE7B0 1px,transparent 1.5px),radial-gradient(#FFB54F 1.2px,transparent 1.8px);background-size:97px 89px,143px 131px;background-position:13px 29px,61px 7px;opacity:.18}
.mark{position:absolute;left:520px;top:110px;width:280px;height:280px}
.txt{position:absolute;left:850px;top:150px}
.word{font:600 96px "Cormorant Garamond",Georgia,serif;letter-spacing:.32em;margin:0 0 10px;line-height:1}
.tag{font:italic 500 38px "Cormorant Garamond",Georgia,serif;color:#FFE7B0;margin:0 0 22px}
.url{font:700 24px Manrope,system-ui,sans-serif;color:#FFB54F;letter-spacing:.04em}
</style></head><body>
<div class="h"><div class="dots"></div>
<img class="mark" src="../mark-transparent.svg" alt="">
<div class="txt"><p class="word">VIGIL</p><p class="tag">No one keeps vigil alone.</p><p class="url">worldvigil.org</p></div>
</div>
</body></html>
